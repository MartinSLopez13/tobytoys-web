<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Tobitoys</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <div>
        <!-- Header Superior Estilo Clásico -->
        <header class="border-b border-slate-200 bg-white py-4 px-6 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                
                <!-- Logo Tobitoys -->
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-black tracking-tight text-blue-600 uppercase">
                        Tobi<span class="text-orange-500">toys</span>
                    </a>
                </div>

                <!-- Buscador Central -->
                <div class="w-full sm:w-96 flex">
                    <input type="text" id="search-input" placeholder="Buscar productos..." class="w-full px-4 py-2 border border-slate-300 rounded-l-md focus:outline-none focus:border-blue-500 text-sm">
                    <button onclick="irCatalogo()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-r-md text-sm transition">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <!-- Botones Derecha (Ingresar / Admin / Carrito) -->
                <div class="flex items-center space-x-4 text-sm font-semibold">
                    <a href="admin.html" id="admin-nav-link" class="text-slate-600 hover:text-blue-600 hidden"><i class="fa-solid fa-gear mr-1"></i> Admin</a>
                    <a href="login.html" class="text-slate-600 hover:text-blue-600 flex items-center space-x-1">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                        <span>INGRESAR</span>
                    </a>
                    <a href="productos.html" class="bg-orange-500 hover:bg-orange-600 text-white px-3 py-2 rounded-md flex items-center space-x-2 transition">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>VER CARRITO</span>
                    </a>
                </div>

            </div>
        </header>

        <!-- Contenido Principal / Bienvenida -->
        <main class="max-w-7xl mx-auto px-6 py-16">
            <div class="text-center max-w-2xl mx-auto space-y-6">
                <span class="bg-blue-50 text-blue-600 border border-blue-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Venta Mayorista y Minorista</span>
                <h1 class="text-4xl sm:text-5xl font-black text-slate-900 tracking-tight">Bienvenidos a Tobitoys</h1>
                <p class="text-slate-600 text-base font-medium">Encontrá el catálogo completo de artículos de librería, marroquinería y juguetes con la mejor atención y envíos a todo el país.</p>
                
                <div class="pt-4">
                    <a href="productos.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3 rounded-lg shadow-sm transition tracking-wide text-sm">
                        Ir al Catálogo de Productos <i class="fa-solid fa-arrow-right ml-2"></i>
                    </a>
                </div>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-100 text-slate-500 py-6 text-center text-xs border-t border-slate-200 mt-20">
        <p>&copy; 2026 Tobitoys. Todos los derechos reservados.</p>
    </footer>

    <!-- Script -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const AUTHORIZED_EMAIL = "rodrigo@tobitoys.com";
            if (localStorage.getItem('admin_logged_email') === AUTHORIZED_EMAIL) {
                document.getElementById('admin-nav-link').classList.remove('hidden');
            }
        });

        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    window.location.href = 'productos.html';
                }
            });
        }

        function irCatalogo() {
            window.location.href = 'productos.html';
        }
    </script>
</body>
</html>
