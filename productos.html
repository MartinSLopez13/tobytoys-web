<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Tobitoys</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <div>
        <!-- Header Superior -->
        <header class="border-b border-slate-200 bg-white py-3 px-6 sticky top-0 z-50 shadow-sm">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                
                <!-- Logo Tobitoys -->
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-black tracking-tight text-blue-600 uppercase">
                        Tobi<span class="text-orange-500">toys</span>
                    </a>
                </div>

                <!-- Buscador Central -->
                <div class="w-full sm:w-96 flex">
                    <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar..." class="w-full px-4 py-2 border border-slate-300 rounded-l-md focus:outline-none focus:border-blue-500 text-sm bg-white">
                    <button class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-r-md text-sm transition">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <!-- Botones Derecha -->
                <div class="flex items-center space-x-6 text-sm font-semibold">
                    <!-- ENLACE ADMIN OCULTO POR DEFECTO -->
                    <a href="admin.html" id="admin-nav-link" class="text-slate-600 hover:text-blue-600 hidden"><i class="fa-solid fa-gear mr-1"></i> Admin</a>
                    
                    <a href="login.html" id="user-nav-link" class="text-slate-600 hover:text-blue-600 flex items-center space-x-1">
                        <i class="fa-regular fa-user"></i>
                        <span id="user-nav-name">MI CUENTA</span>
                    </a>
                    <a href="#" class="text-slate-800 font-bold flex items-center space-x-1">
                        <i class="fa-solid fa-cart-shopping text-slate-600"></i>
                        <span>MI CARRITO</span>
                        <span id="top-cart-count" class="bg-slate-800 text-white text-xs px-1.5 py-0.2 rounded-full font-bold ml-1">0</span>
                    </a>
                </div>

            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="max-w-7xl mx-auto px-6 py-6">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                <!-- 1. Columna Izquierda: Marcas y Subcategorías -->
                <aside class="lg:col-span-3 bg-white border border-slate-200 rounded-lg p-4 h-fit shadow-sm">
                    <h3 class="text-base font-bold text-slate-900 mb-3 pb-2 border-b border-slate-200">Marcas</h3>
                    <ul id="brands-sidebar" class="space-y-2 text-sm">
                        <!-- Dinámico -->
                    </ul>
                </aside>

                <!-- 2. Columna Central: Grilla de Productos -->
                <section class="lg:col-span-6">
                    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Dinámico -->
                    </div>
                </section>

                <!-- 3. Columna Derecha: Carrito ("Mi compra") -->
                <aside class="lg:col-span-3">
                    <div class="bg-white border border-slate-200 rounded-lg p-4 sticky top-20 shadow-sm">
                        
                        <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-200">
                            <span class="font-bold text-xs text-slate-700 flex items-center">
                                <i class="fa-solid fa-cart-shopping text-red-600 mr-1.5"></i> Mi compra
                            </span>
                            <button onclick="finalizeOrder()" class="text-[11px] font-bold text-blue-600 hover:underline">Finalizar &gt;&gt;</button>
                        </div>

                        <div id="cart-items" class="space-y-4 max-h-72 overflow-y-auto mb-4 pr-1">
                            <p class="text-slate-400 text-center py-6 text-xs">No hay productos en el carrito.</p>
                        </div>

                        <div class="border-t border-slate-200 pt-3 space-y-1 text-xs text-slate-600">
                            <div class="flex justify-between font-bold">
                                <span>Total sin IVA</span>
                                <span id="cart-total" class="text-slate-900">$0.00</span>
                            </div>
                            <div class="text-[10px] text-orange-600 font-semibold pt-1">
                                <span>Compra mínima: $100.000</span>
                            </div>
                        </div>

                        <button onclick="finalizeOrder()" class="w-full mt-3 bg-amber-100 hover:bg-amber-200 text-amber-800 border border-amber-300 font-bold py-2 rounded text-xs transition shadow-sm">
                            Finalizar &gt;&gt;
                        </button>

                        <div class="mt-4 pt-3 border-t border-slate-200 space-y-2">
                            <div>
                                <input type="text" id="client-name" class="w-full px-2.5 py-1.5 border border-slate-300 rounded text-xs outline-none focus:border-blue-500" placeholder="Nombre / Comercio">
                            </div>
                            <div class="flex gap-2">
                                <button onclick="sendWhatsApp()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-bold text-xs flex items-center justify-center space-x-1 transition">
                                    <i class="fa-brands fa-whatsapp text-sm"></i>
                                    <span>WHATSAPP</span>
                                </button>
                                <button onclick="sendEmail()" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white py-2 rounded font-bold text-xs flex items-center justify-center space-x-1 transition">
                                    <i class="fa-solid fa-envelope text-sm"></i>
                                    <span>EMAIL</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </aside>

            </div>
        </main>
    </div>

    <footer class="bg-white text-slate-400 py-6 text-center text-xs border-t border-slate-200 mt-20">
        <p>&copy; 2026 Tobitoys. Todos los derechos reservados.</p>
    </footer>

    <!-- Lógica JavaScript -->
    <script>
        const MIN_PURCHASE = 100000;
        const ADMIN_EMAIL = "admin@tobitoys.com";

        window.addEventListener('DOMContentLoaded', () => {
            // Verificar si el usuario logueado es el admin para mostrar el enlace
            const savedAdminEmail = localStorage.getItem('admin_logged_email');
            if (savedAdminEmail && savedAdminEmail.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                document.getElementById('admin-nav-link').classList.remove('hidden');
            }

            // Mostrar nombre del usuario logueado arriba si existe
            const activeUser = JSON.parse(localStorage.getItem('tobitoys_client_user'));
            if (activeUser) {
                document.getElementById('user-nav-name').textContent = activeUser.name.toUpperCase();
                document.getElementById('client-name').value = activeUser.name;
            }

            const repeatItems = JSON.parse(localStorage.getItem('tobitoys_cart_to_repeat'));
            if (repeatItems) {
                cart = repeatItems;
                localStorage.removeItem('tobitoys_cart_to_repeat');
                updateCartUI();
            }

            renderSidebarBrands();
            renderProducts(products);
        });

        let brands = JSON.parse(localStorage.getItem('tobitoys_brands')) || [
            { id: 'chimola', name: 'Chimola' },
            { id: 'arbrex', name: 'Arbrex' },
            { id: 'argos', name: 'Argos' },
            { id: 'surtidos', name: 'Artículos Surtidos' }
        ];

        let products = JSON.parse(localStorage.getItem('tobitoys_products')) || [
            { id: 1, name: "MOCHILA CARRO 12'' CARS", brand: "chimola", subcat: "Mochilas", code: "305BT407", desc: "Línea Mochilas Chimola", price: 49901, stock: 15, image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&q=80" },
            { id: 2, name: "MOCHILA CARRO 12'' CAT", brand: "chimola", subcat: "Mochilas", code: "305BT367", desc: "Línea Mochilas Chimola", price: 49901, stock: 8, image: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=400&q=80" },
            { id: 3, name: "CUADERNO TAPA DURA 100 HOJAS", brand: "arbrex", subcat: "Librería", code: "LIB-001", desc: "Rayado / Universitarios", price: 8500, stock: 30, image: "https://images.unsplash.com/photo-1544816155-12df9643f363?w=400&q=80" },
            { id: 4, name: "SET DE JUGUETES DIDÁCTICOS", brand: "argos", subcat: "Juguetes", code: "JUG-882", desc: "Estimulación temprana", price: 15400, stock: 5, image: "https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=400&q=80" }
        ];

        let cart = [];
        let currentBrand = 'todos';
        let currentSubcat = 'todos';

        function renderSidebarBrands() {
            const sidebar = document.getElementById('brands-sidebar');
            sidebar.innerHTML = `<li><button onclick="setFilter('todos', 'todos')" id="btn-brand-todos" class="brand-btn w-full text-left py-1.5 px-2 rounded text-blue-600 font-bold bg-blue-50 transition">Sugeridos / Todos</button></li>`;

            brands.forEach(brand => {
                const brandProducts = products.filter(p => p.brand === brand.id);
                const subcats = [...new Set(brandProducts.map(p => p.subcat))];

                let subcatHtml = '';
                subcats.forEach(sub => {
                    subcatHtml += `<li><button onclick="setFilter('${brand.id}', '${sub}')" id="btn-sub-${brand.id}-${sub}" class="sub-btn w-full text-left py-1 px-2 text-xs rounded text-slate-500 hover:bg-slate-100 transition pl-4">↳ ${sub}</button></li>`;
                });

                sidebar.innerHTML += `
                    <li class="pt-2">
                        <button onclick="setFilter('${brand.id}', 'todos')" id="btn-brand-${brand.id}" class="brand-btn w-full text-left py-1.5 px-2 rounded font-bold text-slate-700 hover:bg-slate-50 transition flex justify-between items-center">
                            <span>${brand.name}</span>
                            ${subcats.length > 0 ? '<i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>' : ''}
                        </button>
                        ${subcats.length > 0 ? `<ul class="space-y-1 mt-1">${subcatHtml}</ul>` : ''}
                    </li>
                `;
            });
        }

        function renderProducts(itemsToRender) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            if (itemsToRender.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No se encontraron productos.</div>`;
                return;
            }

            itemsToRender.forEach(product => {
                const stockVal = product.stock !== undefined ? product.stock : 10;
                const priceVal = product.price !== undefined ? product.price : 15000;
                const isOutOfStock = stockVal <= 0;
                const brandObj = brands.find(b => b.id === product.brand);
                const brandName = brandObj ? brandObj.name : product.brand;

                grid.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-lg p-3 flex flex-col justify-between shadow-sm hover:shadow transition relative">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[10px] text-slate-400 font-semibold uppercase">${brandName} / ${product.subcat}</span>
                                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${isOutOfStock ? 'bg-red-50 text-red-600' : 'bg-slate-100 text-slate-600'}">
                                    Stk: ${stockVal}
                                </span>
                            </div>
                            <div class="w-full h-32 bg-slate-50 border border-slate-100 rounded flex items-center justify-center p-1 mb-2">
                                <img src="${product.image}" alt="${product.name}" class="w-full h-full object-contain">
                            </div>
                            <h4 class="font-bold text-xs text-slate-800 line-clamp-2">${product.name}</h4>
                            <p class="text-[11px] text-slate-500 mt-0.5">Cod. ${product.code || 'TOBI-' + product.id}</p>
                        </div>

                        <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between">
                            <span class="font-black text-sm text-slate-900">$${priceVal.toLocaleString()}</span>
                            
                            <div class="flex items-center space-x-1.5">
                                <div class="flex items-center border border-slate-300 rounded bg-slate-50 px-1">
                                    <button onclick="adjustCardQty(${product.id}, -1)" class="w-5 h-5 text-slate-700 font-bold flex items-center justify-center text-xs hover:bg-slate-200 rounded">-</button>
                                    <input type="number" id="input-qty-${product.id}" min="1" max="${stockVal}" value="1" class="w-8 text-center text-xs font-bold bg-transparent outline-none">
                                    <button onclick="adjustCardQty(${product.id}, 1)" class="w-5 h-5 text-slate-700 font-bold flex items-center justify-center text-xs hover:bg-slate-200 rounded">+</button>
                                </div>
                                <button onclick="addCustomQtyToCart(${product.id})" ${isOutOfStock ? 'disabled' : ''} class="${isOutOfStock ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-orange-500 hover:bg-orange-600 text-white'} px-2.5 py-1.5 rounded text-xs font-bold transition flex items-center space-x-1 shadow-sm" title="Agregar al carrito">
                                    <i class="fa-solid fa-cart-shopping"></i>
                                    <span>+</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function adjustCardQty(id, delta) {
            const input = document.getElementById(`input-qty-${id}`);
            let current = parseInt(input.value) || 1;
            let newVal = current + delta;
            const product = products.find(p => p.id === id);
            const maxStock = product ? product.stock : 10;

            if (newVal >= 1 && newVal <= maxStock) {
                input.value = newVal;
            }
        }

        function addCustomQtyToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product || product.stock <= 0) return;

            const input = document.getElementById(`input-qty-${id}`);
            const qtyToAdd = parseInt(input.value) || 1;

            const existing = cart.find(item => item.id === id);
            const currentCartQty = existing ? existing.quantity : 0;

            if (currentCartQty + qtyToAdd > product.stock) {
                alert(`No podés agregar esa cantidad. Stock disponible: ${product.stock}`);
                return;
            }

            if (existing) {
                existing.quantity += qtyToAdd;
            } else {
                cart.push({ ...product, quantity: qtyToAdd });
            }

            input.value = 1;
            updateCartUI();
        }

        function filterProducts() {
            const searchText = document.getElementById('search-input').value.toLowerCase();
            let filtered = products.filter(product => {
                const matchesBrand = currentBrand === 'todos' || product.brand === currentBrand;
                const matchesSubcat = currentSubcat === 'todos' || product.subcat === currentSubcat;
                const matchesSearch = product.name.toLowerCase().includes(searchText) || product.desc.toLowerCase().includes(searchText) || (product.code && product.code.toLowerCase().includes(searchText));
                return matchesBrand && matchesSubcat && matchesSearch;
            });
            renderProducts(filtered);
        }

        function setFilter(brand, subcat) {
            currentBrand = brand;
            currentSubcat = subcat;
            filterProducts();
        }

        function changeQty(id, delta) {
            const product = products.find(p => p.id === id);
            const item = cart.find(i => i.id === id);

            if (item) {
                const newQty = item.quantity + delta;
                if (newQty > product.stock) {
                    alert("Supera el stock disponible.");
                    return;
                }
                item.quantity = newQty;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const countSpan = document.getElementById('top-cart-count');
            const itemsContainer = document.getElementById('cart-items');
            const totalSpan = document.getElementById('cart-total');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            countSpan.textContent = totalCount;
            totalSpan.textContent = `$${totalPrice.toLocaleString()}`;

            if (cart.length === 0) {
                itemsContainer.innerHTML = `<p class="text-slate-400 text-center py-6 text-xs">No hay productos en el carrito.</p>`;
                return;
            }

            itemsContainer.innerHTML = '';
            cart.forEach(item => {
                itemsContainer.innerHTML += `
                    <div class="border-b border-slate-100 pb-3 text-xs">
                        <div class="flex justify-between items-start font-bold text-slate-900">
                            <span class="w-36 truncate">${item.name}</span>
                            <span>$${(item.price * item.quantity).toLocaleString()}</span>
                        </div>
                        <div class="text-[11px] text-slate-500 mt-0.5">Precio unitario: $${item.price.toLocaleString()}</div>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-[11px] font-semibold text-slate-700">${item.quantity} Unidad${item.quantity > 1 ? 'es' : ''}</span>
                            <div class="flex items-center space-x-1 border border-slate-200 rounded px-1 bg-slate-50">
                                <button onclick="changeQty(${item.id}, -1)" class="w-5 h-5 text-slate-700 font-bold flex items-center justify-center hover:bg-slate-200 rounded">-</button>
                                <span class="text-xs font-bold w-5 text-center">${item.quantity}</span>
                                <button onclick="changeQty(${item.id}, 1)" class="w-5 h-5 text-slate-700 font-bold flex items-center justify-center hover:bg-slate-200 rounded">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function checkMinPurchase() {
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            if (totalPrice < MIN_PURCHASE) {
                alert(`⚠️ La compra mínima es de $${MIN_PURCHASE.toLocaleString()}. El total actual de tu pedido es $${totalPrice.toLocaleString()}. Agregá más productos para continuar.`);
                return false;
            }
            return true;
        }

        function saveOrderToUserHistory() {
            const activeUser = JSON.parse(localStorage.getItem('tobitoys_client_user'));
            if (!activeUser) return;

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const newOrder = {
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                items: [...cart],
                total: totalPrice
            };

            if (!activeUser.orders) activeUser.orders = [];
            activeUser.orders.push(newOrder);

            localStorage.setItem('tobitoys_client_user', JSON.stringify(activeUser));

            let allClients = JSON.parse(localStorage.getItem('tobitoys_clients')) || [];
            allClients = allClients.map(c => c.email === activeUser.email ? activeUser : c);
            localStorage.setItem('tobitoys_clients', JSON.stringify(allClients));
        }

        function finalizeOrder() {
            if (cart.length === 0) {
                alert("El carrito está vacío.");
                return;
            }
            if (!checkMinPurchase()) return;
            alert("¡Pedido verificado y listo para enviar!");
        }

        function sendWhatsApp() {
            const clientName = document.getElementById('client-name').value.trim() || "Cliente Anónimo";
            if (cart.length === 0) {
                alert("Agregá productos al carrito antes de enviar.");
                return;
            }
            if (!checkMinPurchase()) return;

            saveOrderToUserHistory();

            let message = `Hola! Soy *${clientName}* y quiero hacerles el siguiente pedido en *Tobitoys*:\n\n`;
            let total = 0;
            cart.duplicates = false;
            cart.forEach(item => {
                message += `- ${item.name} (Cant: ${item.quantity}) - Subtotal: $${(item.price * item.quantity).toLocaleString()}\n`;
                total += item.price * item.quantity;
            });
            message += `\n*Total sin IVA: $${total.toLocaleString()}*`;

            const phone = "54911XXXXXXXX";
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function sendEmail() {
            const clientName = document.getElementById('client-name').value.trim() || "Cliente Anónimo";
            if (cart.length === 0) {
                alert("Agregá productos al carrito antes de enviar.");
                return;
            }
            if (!checkMinPurchase()) return;

            saveOrderToUserHistory();

            let body = `Hola, soy ${clientName} y quiero realizar el siguiente pedido:\n\n`;
            let total = 0;
            cart.forEach(item => {
                body += `- ${item.name} (Cant: ${item.quantity}) - Subtotal: $${(item.price * item.quantity).toLocaleString()}\n`;
                total += item.price * item.quantity;
            });
            body += `\nTotal sin IVA: $${total.toLocaleString()}`;

            window.open(`mailto:ventas@tobitoys.com?subject=${encodeURIComponent(`Nuevo Pedido - ${clientName}`)}&body=${encodeURIComponent(body)}`, '_blank');
        }
    </script>
</body>
</html>
